name: Bug
description: Report incorrect website behavior, broken content, link, route, responsive behavior, or regression.
title: "[BUG] "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is currently wrong?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      value: |
        1.
        2.
        3.

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, device/viewport, production/preview URL, language, or route when relevant.

  - type: textarea
    id: evidence
    attributes:
      label: Evidence / notes
      description: Screenshots, broken URLs, suspected cause, or related app issue.

  - type: textarea
    id: done
    attributes:
      label: Done when
      value: |
        - [ ] Bug is fixed
        - [ ] Relevant mobile and desktop behavior is checked
        - [ ] DE/EN behavior is checked when relevant
        - [ ] Affected links/routes work
